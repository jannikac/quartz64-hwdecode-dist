<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>VacuumTube V4L2</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253b4d"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f26b38"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="#4d7a8c" stroke-width="2" opacity="0.7"/>

  <!-- V4L2 / media-controller pins -->
  <g fill="#6fd3c7">
    <rect x="20" y="40" width="10" height="6" rx="2"/>
    <rect x="20" y="61" width="10" height="6" rx="2"/>
    <rect x="20" y="82" width="10" height="6" rx="2"/>
    <rect x="98" y="40" width="10" height="6" rx="2"/>
    <rect x="98" y="61" width="10" height="6" rx="2"/>
    <rect x="98" y="82" width="10" height="6" rx="2"/>
  </g>

  <!-- Play mark -->
  <path d="M51 40 L88 64 L51 88 Z" fill="url(#play)"/>

  <!-- Four small codec markers -->
  <g fill="#d7e6ec">
    <circle cx="34" cy="64" r="2.5"/>
    <circle cx="94" cy="64" r="2.5"/>
    <circle cx="64" cy="31" r="2.5"/>
    <circle cx="64" cy="97" r="2.5"/>
  </g>
</svg>
